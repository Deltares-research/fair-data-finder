name: Build and Push Production Images

# Builds the backend and frontend Docker images and pushes them to the
# registry, tagged with the published release's version, whenever a
# GitHub Release is published.

on:
  release:
    types:
      - published

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: fair-data-finder/backend
            file: fair-data-finder/backend/Dockerfile
            target: production
            image: backend
          - service: frontend
            context: fair-data-finder/frontend
            file: fair-data-finder/frontend/dockerfile
            target: run-prod
            image: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version from release tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_PROJECT }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
