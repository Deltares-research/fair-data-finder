name: Build and Push Development Images


on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: fair-data-finder/backend
            file: fair-data-finder/backend/Dockerfile
            target: production
            image: backend-dev
          - service: frontend
            context: fair-data-finder/frontend
            file: fair-data-finder/frontend/dockerfile
            target: run-prod
            image: frontend-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' fair-data-finder/backend/pyproject.toml | head -n1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_PROJECT }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
            ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_PROJECT }}/${{ matrix.image }}:development
