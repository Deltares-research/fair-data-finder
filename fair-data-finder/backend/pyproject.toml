[project]
name = "dmsapi"
version = "0.1.0"
description = "The backend API implementation for the STAC Data Management Suite"
authors = [{ name = "Nathan Clerkx", email = "nathan.clerkx@deltares.nl" }]
requires-python = "~=3.12"
readme = "README.md"
dependencies = [
    "fastapi-sso>=0.15.0,<0.16",
    "authlib>=1.3.1,<2",
    "alembic>=1.13.2,<2",
    "sqlmodel>=0.0.21,<0.0.22",
    "psycopg[binary]>=3.2.1,<4",
    "psycopg-pool>=3.2.6,<4",
    "stac-fastapi-pgstac>=6.2.2,<7",
    "pypgstac>=0.9.10,<1",
    "asyncpg>=0.29.0,<1",
    "fastapi[standard]>=0.115.11",
    "alembic-postgresql-enum>=1.7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.1,<2",
    "pytest>=8.3.1,<9",
    "pytest-asyncio>=0.23.8,<0.24",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
]

[tool.uv]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.hatch.build.targets.sdist]
include = ["api", "alembic", "alembic.ini", "README.md"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
disable_error_code = ["import-untyped"]
ignore_missing_imports = true
