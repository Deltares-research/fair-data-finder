# Local development stack (all services on one machine).

services:
  postgres:
    image: postgis/postgis:18-master
    container_name: postgres
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./database/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs once before the backend starts.
  # 
  #   pypgstac migrate  -- installs / upgrades the pgstac schema
  #   alembic upgrade head  -- applies app schema migrations (RBAC, keywords, ...)
  migrate:
    container_name: migrate
    image: fair-data-finder/backend
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -c "pypgstac migrate && alembic upgrade head"

  backend:
    container_name: backend
    image: fair-data-finder/backend
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env
    ports:
      - 8000:8000
    expose:
      - 8000
    volumes:
      - ./backend/api:/app/api
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: uv run --no-dev fastapi dev api/app.py --host 0.0.0.0 --port 8000

  frontend:
    container_name: frontend
    image: stac-dms/frontend
    build:
      context: ./frontend
      target: run-dev
    env_file:
      - ./frontend/.env
    environment:
      # Overrides the value in ./frontend/.env: inside the compose network the
      # backend is reachable by service name, not on localhost.
      - NUXT_INTERNAL_API_BASE_URL=http://backend:8000/api
    ports:
      - 24678:24678
      - 3000:3000
    depends_on:
      - backend
    tmpfs:
      - /tmp
    volumes:
      - ./frontend:/src
      - /src/node_modules

  proxy:
    container_name: proxy
    image: fair-data-finder/proxy
    build:
      context: ./proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/data/data:/data
      - ./proxy/data/config:/config
    depends_on:
      - backend
      - frontend
    environment:
      - DOMAIN=localhost
      - PROXY_BACKEND_HOST=backend
      - PROXY_BACKEND_PORT=8000
      - PROXY_FRONTEND_HOST=frontend
      - PROXY_FRONTEND_PORT=3000
