# Production compose for the frontend service.
#
# Required environment variables (set in your shell before running):
#   export HARBOR_REGISTRY=<registry-host>
#   export IMAGE_TAG=<git-sha-or-tag>
#
# Deploy:
#   docker compose -f compose.frontend.prod.yml pull
#   docker compose -f compose.frontend.prod.yml up -d
#
# NOTE: API_URL is consumed at build time by nuxt.config.ts (schema fetch and
# proxy route generation). Make sure the image was built with the correct
# API_URL value pointing at your production backend.

services:
  frontend:
    image: ${HARBOR_REGISTRY}/fair-data-finder/frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Production CMD comes from the Dockerfile `run-prod` target:
    #   node .output/server/index.mjs
